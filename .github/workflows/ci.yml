name: CI

on:
  workflow_dispatch:
  push:
  pull_request:

permissions:
  contents: read

env:
  LINUX_DEPS: >-
    build-essential pkg-config libxkbcommon-dev libxkbcommon-x11-dev
    libwayland-dev libvulkan-dev libx11-dev libx11-xcb-dev libxcb1-dev
    libfontconfig1-dev libfreetype-dev

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test
        run: cargo test --locked
      - name: Build
        run: cargo build --release --locked
      - uses: actions/upload-artifact@v4
        with:
          name: darmoshark-k8-windows-x64
          path: target/release/darmoshark-k8-studio.exe
          if-no-files-found: error

  rust:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y $LINUX_DEPS ripgrep
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Check formatting
        run: cargo fmt -- --check
      - name: Test
        run: cargo test --locked
      - name: Reject generated or legacy runtime files
        run: |
          test -z "$(find . -path './target' -prune -o -type f \( -name '*.py' -o -name '*.pyc' -o -name 'pyproject.toml' \) -print)"
          ! rg -i 'python|__pycache__|pyproject' --glob '!Cargo.lock' .

  nix:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - uses: DeterminateSystems/determinate-nix-action@v3
      - uses: DeterminateSystems/flakehub-cache-action@v3
        with:
          use-gha-cache: enabled
      - run: nix flake check
