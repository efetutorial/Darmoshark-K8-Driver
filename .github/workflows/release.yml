name: Release packages

on:
  push:
    tags: ['v*']

permissions:
  contents: read

env:
  LINUX_DEPS: >-
    build-essential pkg-config libxkbcommon-dev libxkbcommon-x11-dev
    libwayland-dev libvulkan-dev libx11-dev libx11-xcb-dev libxcb1-dev
    libfontconfig1-dev libfreetype-dev

jobs:
  windows-packages:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test
        run: cargo test --locked
      - name: Build
        run: cargo build --release --locked
      - name: Prepare executable
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target/release/darmoshark-k8-studio.exe dist/darmoshark-k8-studio-windows-x86_64.exe
      - uses: actions/upload-artifact@v4
        with:
          name: windows-packages
          path: dist/*.exe
          if-no-files-found: error

  linux-packages:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y $LINUX_DEPS
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Test and check formatting
        run: |
          cargo fmt -- --check
          cargo test --locked
      - name: Build
        run: cargo build --release --locked
      - name: Build Debian and RPM packages
        run: |
          cargo install --locked cargo-deb cargo-generate-rpm
          cargo deb --no-build --no-strip
          cargo generate-rpm
      - name: Prepare release files and Arch PKGBUILD
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          version="${VERSION#v}"
          archive_url="https://github.com/${GITHUB_REPOSITORY}/archive/refs/tags/${VERSION}.tar.gz"
          curl --fail --location --retry 3 "$archive_url" --output /tmp/source.tar.gz
          checksum="$(sha256sum /tmp/source.tar.gz | cut -d ' ' -f 1)"
          repository_name="${GITHUB_REPOSITORY#*/}"
          mkdir -p dist
          sed -e "s|@VERSION@|$version|g" \
              -e "s|@GITHUB_REPOSITORY@|${GITHUB_REPOSITORY}|g" \
              -e "s|@REPOSITORY_NAME@|$repository_name|g" \
              -e "s|@SHA256@|$checksum|g" \
              packaging/arch/PKGBUILD.in > dist/PKGBUILD
          cp packaging/99-darmoshark-k8.rules dist/
          cp target/debian/*.deb dist/
          cp target/generate-rpm/*.rpm dist/
          tar -czf "dist/darmoshark-k8-studio_${version}_linux_x86_64.tar.gz" \
            -C target/release darmoshark-k8-studio
      - uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: dist/*
          if-no-files-found: error

  publish:
    needs: [windows-packages, linux-packages]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        with:
          pattern: '*-packages'
          path: artifacts
      - name: Gather packages and checksums
        run: |
          mkdir -p dist
          find artifacts -type f -exec cp -t dist -- {} +
          for file in dist/*; do
            normalized="${file// /.}"
            if [ "$file" != "$normalized" ]; then
              mv -- "$file" "$normalized"
            fi
          done
          cd dist
          sha256sum -- * > SHA256SUMS.txt
      - name: Publish release after all checks pass
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
            gh release edit "$TAG" --draft=false --latest --notes-file .github/release-notes.md
          else
            gh release create "$TAG" dist/* --verify-tag --latest \
              --title "Darmoshark K8 Studio $TAG" --notes-file .github/release-notes.md
          fi
