name: Release packages

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  windows-packages:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Test Windows core
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml
      - name: Build Windows installer
        uses: tauri-apps/tauri-action@v1
        with:
          projectPath: src-tauri
          args: --bundles nsis -- --locked
      - name: Prepare standalone executable
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item src-tauri/target/release/darmoshark-k8-studio.exe dist/darmoshark-k8-studio-windows-x86_64.exe
      - uses: actions/upload-artifact@v4
        with:
          name: windows-packages
          path: |
            dist/*.exe
            src-tauri/target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error

  linux-packages:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
      - name: Install Linux packaging dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libglib2.0-dev \
            libsoup-3.0-dev libappindicator3-dev librsvg2-dev patchelf libfuse2 rpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Test Linux core and formatting
        run: |
          cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
          cargo test --locked --manifest-path src-tauri/Cargo.toml
      - name: Build Debian, RPM and AppImage packages
        uses: tauri-apps/tauri-action@v1
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1'
        with:
          projectPath: src-tauri
          args: --bundles deb,rpm,appimage -- --locked
      - name: Prepare release files and Arch PKGBUILD
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          version="${VERSION#v}"
          archive_url="https://github.com/${GITHUB_REPOSITORY}/archive/refs/tags/${VERSION}.tar.gz"
          curl --fail --location --retry 3 "$archive_url" --output /tmp/source.tar.gz
          checksum="$(sha256sum /tmp/source.tar.gz | cut -d ' ' -f 1)"
          repository_name="${GITHUB_REPOSITORY#*/}"
          mkdir -p dist
          sed -e "s|@VERSION@|$version|g" \
              -e "s|@GITHUB_REPOSITORY@|${GITHUB_REPOSITORY}|g" \
              -e "s|@REPOSITORY_NAME@|$repository_name|g" \
              -e "s|@SHA256@|$checksum|g" \
              packaging/arch/PKGBUILD.in > dist/PKGBUILD
          cp packaging/99-darmoshark-k8.rules dist/
          cp src-tauri/target/release/bundle/deb/*.deb dist/
          cp src-tauri/target/release/bundle/rpm/*.rpm dist/
          cp src-tauri/target/release/bundle/appimage/*.AppImage dist/
          tar -czf "dist/darmoshark-k8-studio_${version}_linux_x86_64.tar.gz" \
            -C src-tauri/target/release darmoshark-k8-studio
      - uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: dist/*
          if-no-files-found: error

  frontend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run check
      - run: npm test

  publish:
    needs: [windows-packages, linux-packages, frontend]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        with:
          pattern: '*-packages'
          path: artifacts
      - name: Gather packages and checksums
        run: |
          mkdir -p dist
          find artifacts -type f -exec cp -t dist -- {} +
          for file in dist/*; do
            normalized="${file// /.}"
            if [ "$file" != "$normalized" ]; then
              mv -- "$file" "$normalized"
            fi
          done
          cd dist
          sha256sum -- * > SHA256SUMS.txt
      - name: Publish release after all checks pass
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
            gh release edit "$TAG" --draft=false --latest --notes-file .github/release-notes.md
          else
            gh release create "$TAG" dist/* --verify-tag --latest \
              --title "Darmoshark K8 Studio $TAG" --notes-file .github/release-notes.md
          fi
